name: Build (reusable)

# Single source of truth for this frontend's pipeline. Called by ci.yml
# (PR gate, no publish), dev.yml (demo build → dev branch) and release.yml
# (production build → release branch + deploy ping). Behaviour is selected
# entirely through the inputs below so the build body lives in exactly one
# place. See AGENTS.md for the --no-package-lock / NPM_TOKEN rationale.

on:
  workflow_call:
    inputs:
      demo_mode:
        description: Value for PUBLIC_DEMO_MODE on publishing builds (dev=true, release=false). Ignored by CI (no publish → var stays unset).
        type: boolean
        default: false
      og_smoke:
        description: Run the og:smoke font-path regression check (landingpage/blog only).
        type: boolean
        default: false
      publish_branch:
        description: Orphan branch to force-publish dist/ to (dev | release). Empty = no publish.
        type: string
        default: ''
      deploy:
        description: Ping the deploy webhook after publishing (release only).
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No permissions: block here - a reusable workflow cannot request more than
    # the caller's token holds, and the repo default is read-only. Each caller
    # grants least-privilege permissions instead.

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Pin npm
        # Node 22 ships npm 10, whose arborist crashes with
        # "Cannot read properties of null (reading 'edgesOut')" on some
        # dependency graphs. Astro 7.3.0 (2026-09-03) introduced one: the first
        # build after that publish failed at Install, before a single test ran,
        # on a commit that touched no manifest. npm 11 resolves the same tree
        # without complaint.
        #
        # This bites here and not elsewhere because `--no-package-lock` below
        # re-resolves every caret range on every run — so a publish by any
        # dependency can change the graph between two builds of the same
        # commit. That is the trade for a lockfile this repo cannot use; the
        # cost is that the npm doing the resolving has to be current.
        # tds-landingpage-frontend hit this first and carries the same step.
        run: npm install -g npm@11

      - name: Install
        # The Windows-generated lockfile is win32-only, so --no-package-lock is
        # required for the Linux runner to resolve the right native binaries
        # (see AGENTS.md / npm/cli#4828).
        run: npm install --no-package-lock
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:run

      - name: OG smoke
        if: ${{ inputs.og_smoke }}
        run: npm run og:smoke

      - name: Configure demo mode
        # Only export PUBLIC_DEMO_MODE on publishing builds (dev/release). CI
        # doesn't publish, so the var stays unset there, exactly as the
        # standalone ci.yml did. The boolean renders as the string true/false.
        if: ${{ inputs.publish_branch != '' }}
        run: echo "PUBLIC_DEMO_MODE=${{ inputs.demo_mode }}" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Build-time fallback translation for posts that still lack a
          # counterpart language (src/lib/translate.ts). Optional — unset
          # gracefully renders the authored language instead. Rarely fires
          # since the content-api's save-time sync stores real counterpart
          # rows; it only covers content the backfill hasn't touched.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: npm run build

      - name: Stamp build
        if: ${{ inputs.publish_branch != '' }}
        # Inside client/, which is the document root. Anywhere else in the
        # release tree it would not be fetchable — server/ and the app root are
        # deliberately not web-reachable.
        run: |
          mkdir -p release/client
          {
            echo "channel=${{ inputs.publish_branch }}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > release/client/.build-info

      - name: Publish release tree to ${{ inputs.publish_branch }} branch
        if: ${{ inputs.publish_branch != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.NPM_TOKEN }}
          # `release/`, not `dist/`: this site is server-rendered now, so the
          # host needs the SSR bundle, the Passenger startup file and a
          # prebuilt node_modules alongside the document root. The tree is
          # assembled by scripts/pack-release.mjs, which runs as postbuild and
          # refuses to produce one that could not start on the host.
          publish_dir: ./release
          publish_branch: ${{ inputs.publish_branch }}
          commit_message: '${{ inputs.publish_branch }} ${{ github.sha }}'
          force_orphan: true

      - name: Trigger deploy webhook
        if: ${{ inputs.deploy }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not set - skipping deploy ping."
            exit 0
          fi
          echo "Pinging deploy webhook..."
          # release/ is already published by now, so a failed ping must NOT
          # red the run. Capture status, never exit non-zero, warn on failure.
          # Plesk's git web-hook only answers POST (a bare GET 404s); -L follows
          # any panel redirect and re-POSTs. A failed ping still must not red the run.
          echo "POSTing deploy webhook to $(printf '%s' "$DEPLOY_WEBHOOK_URL" | cut -d/ -f1-3) ..."
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -L --post301 --post302 --post303 \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$DEPLOY_WEBHOOK_URL" || echo "000")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook pinged (HTTP $code)."
          else
            echo "::warning title=Deploy webhook failed::Webhook returned HTTP $code. The release branch is published but the host was not notified - check DEPLOY_WEBHOOK_URL."
          fi

      # The file-backed page cache on the host outlives a deploy: cached routes
      # keep answering 200 while pointing at asset hashes that no longer exist,
      # and only the uncached ones render correctly. This clears it, then warms
      # it again - which used to be a manual job after every release.
      - name: Refresh the page cache
        if: ${{ inputs.deploy }}
        env:
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
          TDS_CACHE_TOKEN: ${{ secrets.TDS_CACHE_TOKEN }}
        run: |
          # Never `set -e`: release/ is published and the host is already
          # notified by this point, so nothing below may red the run. Every
          # failure is a warning and an early, successful exit.
          set +e
          if [ -z "${SITE_ORIGIN}" ] || [ -z "${TDS_CACHE_TOKEN}" ]; then
            echo "SITE_ORIGIN or TDS_CACHE_TOKEN not set - skipping cache refresh."
            exit 0
          fi
          origin="${SITE_ORIGIN%/}"

          # ---- 1. Wait until the host actually serves THIS commit -----------
          # The deploy webhook is fire-and-forget; the host pulls asynchronously.
          # Purging before the new code is live would clear the OLD build's
          # cache, which the OLD build would immediately refill - leaving
          # exactly the stale pages this step exists to remove. `.build-info` is
          # stamped with the commit and lives in the document root for this.
          deadline=$(( $(date +%s) + 300 ))
          live=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            info=$(curl -sS -L --max-time 15 "${origin}/.build-info" 2>/dev/null)
            case "$info" in
              *"commit=${GITHUB_SHA}"*) live="yes"; break ;;
            esac
            sleep 10
          done
          if [ -z "$live" ]; then
            echo "::warning title=Cache left untouched::${origin} is still not serving ${GITHUB_SHA} after 5 minutes. Purging now would only clear the previous build's cache and it would refill immediately, so nothing was done."
            exit 0
          fi
          echo "Host is serving ${GITHUB_SHA}."

          # ---- 2. Purge ----------------------------------------------------
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -L --max-time 60 \
            -H "x-tds-cache-token: ${TDS_CACHE_TOKEN}" \
            -H 'content-type: application/json' \
            -d '{}' "${origin}/tds/cache/purge" 2>/dev/null)
          if [ "${code:-000}" -ge 200 ] && [ "${code:-000}" -lt 300 ]; then
            echo "Page cache purged (HTTP ${code})."
          else
            echo "::warning title=Cache purge failed::HTTP ${code:-000} from ${origin}/tds/cache/purge - stale pages may still be served. Check TDS_CACHE_TOKEN against the host's runtime environment."
            exit 0
          fi

          # ---- 3. Warm it, but only when the site knows its API -------------
          # Honest about what this proves: `connected` says the site is PAIRED
          # with an API base, not that the API is answering this second. A real
          # liveness gate is not available from here, because the public content
          # fetches are fail-soft by design - during an outage a page still
          # returns 200, just with a section missing.
          #
          # That is the residual risk of warming on deploy, and it is the known
          # cost of the choice: whatever is warmed now stays cached until the
          # next deploy. The gate removes the cheap half of the problem (a site
          # that is not paired at all); the expensive half is accepted.
          status=$(curl -sS -L --max-time 20 "${origin}/tds/connect/status" 2>/dev/null)
          case "$status" in
            *'"connected":true'*) ;;
            *)
              echo "::warning title=Cache left cold::${origin}/tds/connect/status did not report a connected site, so the warm-up was skipped. The cache is empty and correct - visitors will refill it. Warming an unpaired site would cache its degraded pages until the next deploy."
              exit 0
              ;;
          esac

          # The site's own sitemap is the route list, so this warms exactly what
          # is published and needs no second list to keep in step. Plain GETs:
          # the cache fills the same way a visitor fills it, which is also why
          # no `rebuild` endpoint is needed (the control plane has none).
          urls=$(curl -sS -L --max-time 30 "${origin}/sitemap-0.xml" 2>/dev/null \
            | grep -o '<loc>[^<]*</loc>' | sed 's|</\?loc>||g' | head -40)
          if [ -z "$urls" ]; then
            echo "::warning title=Cache left cold::Could not read ${origin}/sitemap-0.xml, so no page was warmed. The cache is empty and correct; visitors will refill it."
            exit 0
          fi

          warmed=0
          failed=0
          for u in $urls; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 45 "$u" 2>/dev/null)
            if [ "${c:-000}" -ge 200 ] && [ "${c:-000}" -lt 300 ]; then
              warmed=$((warmed + 1))
            else
              failed=$((failed + 1))
              echo "  warm ${u} -> HTTP ${c:-000}"
            fi
            # A moment between renders: this is a single-process Node host and
            # the point is a warm cache, not a load test against our own site.
            sleep 1
          done
          echo "Page cache warmed: ${warmed} ok, ${failed} failed."
          if [ "$failed" -gt 0 ]; then
            echo "::warning title=Some pages did not warm::${failed} of $((warmed + failed)) sitemap URLs did not return 2xx. They are simply uncached - the first visitor renders them."
          fi
