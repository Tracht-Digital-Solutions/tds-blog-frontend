name: Deploy to netcup

on:
  push:
    branches: [main]
  workflow_dispatch:    # used by tds-content-api after publish to rebuild

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Install
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Compute release timestamp
        id: ts
        run: echo "RELEASE=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Marker
        run: touch dist/.deploy-complete

      - name: Upload to netcup via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NETCUP_FTP_HOST }}
          username: ${{ secrets.NETCUP_FTP_USER }}
          password: ${{ secrets.NETCUP_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./sites/blog.tracht-digital.de/releases/${{ steps.ts.outputs.RELEASE }}/
          dangerous-clean-slate: false

      - name: Trigger installer
        run: |
          curl --fail --silent --show-error \
            "${{ vars.INSTALLER_URL }}?action=install-static&target=blog.tracht-digital.de&release=${{ steps.ts.outputs.RELEASE }}&token=${{ secrets.INSTALL_TOKEN }}"
