name: Build → build branch

# Builds the static dist/ on every push to main and force-publishes
# it as an orphan commit on the `build` branch. The branch always
# holds exactly the latest build — useful for inspecting what got
# built, for pulling the artifact into a deploy target, or for
# diffing two builds. Netcup deployment is manual; see README.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight builds when a newer push arrives — the build
# branch only needs the latest, and superseded runs would just
# force-push over each other anyway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Install
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Stamp build with source commit
        run: |
          mkdir -p dist
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > dist/.build-info

      - name: Publish dist to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.NPM_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
          commit_message: 'build ${{ github.sha }}'
          force_orphan: true
