name: Build → build branch

# Builds the static dist/ on every push to main, force-publishes it as
# an orphan commit on the `build` branch, then pings the deploy webhook
# so the production host pulls that branch and goes live automatically.
# The `build` branch always holds exactly the latest build — handy for
# inspecting what got built or diffing two builds. See README for the
# DEPLOY_WEBHOOK_URL secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight builds when a newer push arrives — the build
# branch only needs the latest, and superseded runs would just
# force-push over each other anyway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Install
        # Using `npm install --no-package-lock` — the lockfile was
        # generated on Windows and only registers win32 platform
        # binaries (rollup, lightningcss, esbuild, sharp,
        # tailwindcss-oxide) under node_modules/. Both `npm ci` and
        # `npm install` honor that and skip the Linux binaries;
        # --no-package-lock makes npm ignore the lockfile entirely
        # and resolve from package.json so the right platform
        # binaries get installed (npm/cli#4828).
        run: npm install --no-package-lock
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Stamp build with source commit
        run: |
          mkdir -p dist
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > dist/.build-info

      - name: Publish dist to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.NPM_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
          commit_message: 'build ${{ github.sha }}'
          force_orphan: true

      - name: Trigger deploy webhook
        # Ping the production host's deploy hook so it pulls the freshly
        # published `build` branch and goes live -- no manual SFTP. The
        # deploy token is carried inside DEPLOY_WEBHOOK_URL itself.
        # Skips quietly when the secret isn't configured yet.
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not set - skipping deploy ping."
            exit 0
          fi
          echo "Pinging deploy webhook..."
          # dist/ is already published to the build branch by the time we get
          # here, so a failed deploy ping must NOT red the build (a wrong URL
          # or a host hiccup shouldn't mask a good build). Capture the status,
          # never exit non-zero, and surface a failure as a loud Actions
          # warning instead. "000" = curl couldn't even connect.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$DEPLOY_WEBHOOK_URL" || echo "000")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook pinged (HTTP $code)."
          else
            echo "::warning title=Deploy webhook failed::Webhook returned HTTP $code. The build branch is published but the production host was not notified - check the DEPLOY_WEBHOOK_URL secret."
          fi
