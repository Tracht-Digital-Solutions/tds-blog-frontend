name: CI

# Runs on every push and PR. Distinct from build.yml — this one
# never publishes to the `build` branch, it just gates merges by
# making sure type-check + build pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Install
        # Using `npm install --no-package-lock` — the lockfile was
        # generated on Windows and only registers win32 platform
        # binaries (rollup, lightningcss, esbuild, sharp,
        # tailwindcss-oxide) under node_modules/. Both `npm ci` and
        # `npm install` honor that and skip the Linux binaries;
        # --no-package-lock makes npm ignore the lockfile entirely
        # and resolve from package.json so the right platform
        # binaries get installed (npm/cli#4828).
        run: npm install --no-package-lock
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Build
        # Build can do a runtime fetch against content-api; allow it
        # to succeed even if that fetch fails since journal teaser
        # endpoints degrade gracefully.
        run: npm run build
