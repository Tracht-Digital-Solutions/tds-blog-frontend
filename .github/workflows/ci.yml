name: CI

# Runs on every push and PR. Distinct from build.yml — this one
# never publishes to the `build` branch, it just gates merges by
# making sure type-check + build pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Install
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install missing rollup Linux binary
        # Workaround for npm/cli#4828 — the Windows-generated
        # package-lock.json only registers the win32 rollup native
        # binary under node_modules/, so `npm ci` on Linux skips
        # @rollup/rollup-linux-x64-gnu even though it's listed as an
        # optional dep. Install the matching version explicitly so
        # astro/vite can load rollup native modules.
        run: |
          ROLLUP_VERSION=$(node -p "require('rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Build
        # Build can do a runtime fetch against content-api; allow it
        # to succeed even if that fetch fails since journal teaser
        # endpoints degrade gracefully.
        run: npm run build
