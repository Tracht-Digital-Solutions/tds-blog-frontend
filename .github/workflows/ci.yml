name: CI

# PR-only merge gate: type-check + test + og:smoke + build, no publish.
# Push-to-main correctness is covered by dev.yml (single build per push).
# The pipeline body lives in _build.yml.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    uses: ./.github/workflows/_build.yml
    with:
      og_smoke: true
    secrets: inherit
